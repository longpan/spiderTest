[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/tmp/supervisord.pid

[program:vnc_stack]
command=/bin/bash -lc "/home/ubuntu/selenium/vnc/vnc_start_public.sh && tail -F /home/ubuntu/selenium/x11vnc.log"
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/vnc.out.log
stderr_logfile=/var/log/supervisor/vnc.err.log

[program:ai_service]
directory=/home/ubuntu/ai_service
command=/opt/venv/bin/python -m uvicorn mh_ai_service:app --host 0.0.0.0 --port %(ENV_AI_PORT)s
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/ai.out.log
stderr_logfile=/var/log/supervisor/ai.err.log

[program:spider]
directory=/home/ubuntu/java_app
command=/usr/bin/java -Dselenuim.config=/home/ubuntu/selenium/config.ini -jar /home/ubuntu/java_app/spider.jar
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/spider.out.log
stderr_logfile=/var/log/supervisor/spider.err.log
