<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/layout :: layout(title='宠物数据', active='pets')}">
<head>
    <title>宠物数据</title>
    <style>
        /* 表格滚动容器 */
        .table-scroll-container {
            max-height: calc(100vh - 380px);
            overflow-y: auto;
            overflow-x: hidden;
        }
        
        /* 自定义滚动条 */
        .table-scroll-container::-webkit-scrollbar {
            width: 8px;
        }
        .table-scroll-container::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }
        .table-scroll-container::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 4px;
        }
        .table-scroll-container::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8;
        }
        
        /* 固定表头 */
        .table-scroll-container .ant-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }
        .table-scroll-container .ant-table thead {
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .table-scroll-container .ant-table thead th {
            background: #fafafa;
            border-bottom: 2px solid #f0f0f0;
        }
        
        /* 分页包装器 */
        .pagination-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            border-top: 1px solid #f0f0f0;
            background: #fafafa;
        }
        .pagination-info {
            font-size: 14px;
            color: #595959;
        }
        .pagination-info strong {
            color: #262626;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div th:fragment="content">
        <!-- 页面标题 -->
        <div class="page-header">
            <h4>宠物数据</h4>
            <div class="breadcrumb">首页 / 宠物数据</div>
        </div>

        <!-- 搜索卡片 -->
        <div class="ant-card">
            <div class="card-body">
                <form method="get" class="row g-3 align-items-end">
                    <div class="col-md-3">
                        <label class="form-label">宠物名称</label>
                        <select name="name" class="ant-input">
                            <option value="">全部</option>
                            <option th:each="n : ${petNames}" th:value="${n.name}" th:text="${n.name} + ' (' + ${n.count} + ')'" th:selected="${n.name == name}"></option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">服务器</label>
                        <select name="serverName" class="ant-input">
                            <option value="">全部</option>
                            <option th:each="s : ${serverNames}" th:value="${s}" th:text="${s}" th:selected="${s == serverName}"></option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">每页条数</label>
                        <select name="size" class="ant-input">
                            <option value="50" th:selected="${pageSize == 50}">50条</option>
                            <option value="100" th:selected="${pageSize == 100}">100条</option>
                            <option value="200" th:selected="${pageSize == 200}">200条</option>
                            <option value="500" th:selected="${pageSize == 500}">500条</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">排序字段</label>
                        <select name="sortField" class="ant-input">
                            <option value="updateTime" th:selected="${sortField == 'updateTime'}">更新时间</option>
                            <option value="price" th:selected="${sortField == 'price'}">价格</option>
                            <option value="collect" th:selected="${sortField == 'collect'}">收藏数</option>
                            <option value="skillNum" th:selected="${sortField == 'skillNum'}">技能数</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">排序方向</label>
                        <select name="sortOrder" class="ant-input">
                            <option value="desc" th:selected="${sortOrder == 'desc'}">降序</option>
                            <option value="asc" th:selected="${sortOrder == 'asc'}">升序</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="ant-btn ant-btn-primary">
                            <i class="bi bi-search"></i> 查询
                        </button>
                        <a href="/admin/pets" class="ant-btn ms-2">重置</a>
                    </div>
                </form>
            </div>
        </div>

        <!-- 数据列表 - 表格布局 -->
        <div class="ant-card">
            <div class="card-header">
                <h5><i class="bi bi-collection me-2"></i>宠物列表</h5>
                <span class="text-muted" th:text="'共 ' + ${total} + ' 条'">共 0 条</span>
            </div>
            <div class="card-body p-0">
                <!-- 表格容器带滚动 -->
                <div class="table-scroll-container">
                    <table class="ant-table">
                        <thead>
                            <tr>
                                <th style="width: 60px;">ID</th>
                                <th style="width: 140px;">编号</th>
                                <th>名称</th>
                                <th style="width: 80px;">等级</th>
                                <th>服务器</th>
                                <th style="width: 100px;" class="sortable-header">
                                    <a th:href="@{/admin/pets(page=1, size=${pageSize}, name=${name}, serverName=${serverName}, sortField='price', sortOrder=${sortField == 'price' && sortOrder == 'asc' ? 'desc' : 'asc'})}" class="sort-link">
                                        价格
                                        <i th:if="${sortField == 'price'}" class="bi" th:classappend="${sortOrder == 'asc' ? 'bi-sort-up' : 'bi-sort-down'}"></i>
                                        <i th:unless="${sortField == 'price'}" class="bi bi-filter"></i>
                                    </a>
                                </th>
                                <th style="width: 70px;" class="sortable-header">
                                    <a th:href="@{/admin/pets(page=1, size=${pageSize}, name=${name}, serverName=${serverName}, sortField='collect', sortOrder=${sortField == 'collect' && sortOrder == 'asc' ? 'desc' : 'asc'})}" class="sort-link">
                                        收藏
                                        <i th:if="${sortField == 'collect'}" class="bi" th:classappend="${sortOrder == 'asc' ? 'bi-sort-up' : 'bi-sort-down'}"></i>
                                        <i th:unless="${sortField == 'collect'}" class="bi bi-filter"></i>
                                    </a>
                                </th>
                                <th style="width: 80px;" class="sortable-header">
                                    <a th:href="@{/admin/pets(page=1, size=${pageSize}, name=${name}, serverName=${serverName}, sortField='skillNum', sortOrder=${sortField == 'skillNum' && sortOrder == 'asc' ? 'desc' : 'asc'})}" class="sort-link">
                                        技能数
                                        <i th:if="${sortField == 'skillNum'}" class="bi" th:classappend="${sortOrder == 'asc' ? 'bi-sort-up' : 'bi-sort-down'}"></i>
                                        <i th:unless="${sortField == 'skillNum'}" class="bi bi-filter"></i>
                                    </a>
                                </th>
                                <th style="width: 120px;">亮点1</th>
                                <th style="width: 120px;">亮点2</th>
                                <th style="width: 100px;" class="sortable-header">
                                    <a th:href="@{/admin/pets(page=1, size=${pageSize}, name=${name}, serverName=${serverName}, sortField='updateTime', sortOrder=${sortField == 'updateTime' && sortOrder == 'asc' ? 'desc' : 'asc'})}" class="sort-link">
                                        更新时间
                                        <i th:if="${sortField == 'updateTime'}" class="bi" th:classappend="${sortOrder == 'asc' ? 'bi-sort-up' : 'bi-sort-down'}"></i>
                                        <i th:unless="${sortField == 'updateTime'}" class="bi bi-filter"></i>
                                    </a>
                                </th>
                                <th style="width: 120px;">操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="pet : ${pets}">
                                <td th:text="${pet.id}">1</td>
                                <td th:text="${pet.code}" style="font-family: monospace; font-size: 12px;">-</td>
                                <td>
                                    <span class="fw-medium" th:text="${pet.name} ?: '-'">-</span>
                                </td>
                                <td th:text="${pet.level} ?: '-'">-</td>
                                <td>
                                    <span th:text="${pet.area} ?: ''" class="text-muted small"></span>
                                    <span th:if="${pet.area != null and pet.serverName != null}" class="text-muted small"> / </span>
                                    <span th:text="${pet.serverName} ?: '-'" class="fw-medium"></span>
                                </td>
                                <td>
                                    <span th:if="${pet.price != null}" style="color: #ff4d4f; font-weight: 500;" th:text="'¥' + ${pet.price}">¥0</span>
                                    <span th:if="${pet.price == null}">-</span>
                                </td>
                                <td>
                                    <span class="ant-tag ant-tag-default" th:text="${pet.collect} ?: '0'">0</span>
                                </td>
                                <td>
                                    <span class="ant-tag ant-tag-processing" th:text="${pet.skillNum} ?: '0'">0</span>
                                </td>
                                <td>
                                    <span class="text-truncate d-inline-block" style="max-width: 110px; font-size: 12px;" th:text="${pet.lightSpot1} ?: '-'" title="${pet.lightSpot1}">-</span>
                                </td>
                                <td>
                                    <span class="text-truncate d-inline-block" style="max-width: 110px; font-size: 12px;" th:text="${pet.lightSpot2} ?: '-'" title="${pet.lightSpot2}">-</span>
                                </td>
                                <td th:text="${#dates.format(pet.updateTime, 'MM-dd HH:mm')}">01-01 12:00</td>
                                <td>
                                    <button class="ant-btn ant-btn-primary ant-btn-sm" th:data-pet-id="${pet.id}" onclick="showDetail(this.getAttribute('data-pet-id'))" title="详情">
                                        <i class="bi bi-eye"></i>
                                    </button>
                                    <button class="ant-btn ant-btn-sm ms-1" th:data-item-code="${pet.code}" onclick="createReplayTask(this.getAttribute('data-item-code'))" title="重新爬取">
                                        <i class="bi bi-arrow-clockwise"></i>
                                    </button>
                                    <a th:href="${pet.detailUrl}" target="_blank" class="ant-btn ant-btn-sm ms-1" title="查看原页">
                                        <i class="bi bi-box-arrow-up-right"></i>
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- 分页 -->
                <div class="pagination-wrapper" th:if="${totalPages != null and totalPages > 1}">
                    <div class="pagination-info">
                        <span>共 <strong th:text="${total}">0</strong> 条</span>
                        <span class="ms-3">第 <strong th:text="${currentPage}">1</strong> / <strong th:text="${totalPages}">1</strong> 页</span>
                    </div>
                    <div class="ant-pagination">
                        <a th:href="@{/admin/pets(page=1, size=${pageSize}, name=${name}, serverName=${serverName}, sortField=${sortField}, sortOrder=${sortOrder})}" 
                           th:classappend="${currentPage <= 1} ? 'disabled'" 
                           th:style="${currentPage <= 1} ? 'opacity: 0.5; pointer-events: none;' : ''">首页</a>
                        
                        <a th:href="@{/admin/pets(page=${currentPage - 1}, size=${pageSize}, name=${name}, serverName=${serverName}, sortField=${sortField}, sortOrder=${sortOrder})}" 
                           th:classappend="${currentPage <= 1} ? 'disabled'" 
                           th:style="${currentPage <= 1} ? 'opacity: 0.5; pointer-events: none;' : ''">上一页</a>
                        
                        <!-- 页码显示 - 最多显示5个页码 -->
                        <th:block th:with="start=${currentPage > 3 ? (currentPage + 2 > totalPages ? totalPages - 4 : currentPage - 2) : 1},
                                           end=${start + 4 > totalPages ? totalPages : start + 4}">
                            <a th:each="i : ${#numbers.sequence(start > 0 ? start : 1, end)}"
                               th:href="@{/admin/pets(page=${i}, size=${pageSize}, name=${name}, serverName=${serverName}, sortField=${sortField}, sortOrder=${sortOrder})}" 
                               th:text="${i}" 
                               th:classappend="${i == currentPage} ? 'active'">1</a>
                        </th:block>
                        
                        <a th:href="@{/admin/pets(page=${currentPage + 1}, size=${pageSize}, name=${name}, serverName=${serverName}, sortField=${sortField}, sortOrder=${sortOrder})}" 
                           th:classappend="${currentPage >= totalPages} ? 'disabled'"
                           th:style="${currentPage >= totalPages} ? 'opacity: 0.5; pointer-events: none;' : ''">下一页</a>
                        
                        <a th:href="@{/admin/pets(page=${totalPages}, size=${pageSize}, name=${name}, serverName=${serverName}, sortField=${sortField}, sortOrder=${sortOrder})}" 
                           th:classappend="${currentPage >= totalPages} ? 'disabled'"
                           th:style="${currentPage >= totalPages} ? 'opacity: 0.5; pointer-events: none;' : ''">末页</a>
                    </div>
                </div>
            </div>
        </div>

        <!-- 详情模态框 -->
        <div class="modal fade" id="detailModal" tabindex="-1">
            <div class="modal-dialog modal-xl">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">宠物详情</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div id="detailContent"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <style th:fragment="styles">
        /* 表格滚动容器 */
        .table-scroll-container {
            max-height: calc(100vh - 380px);
            overflow-y: auto;
            overflow-x: hidden;
        }
        
        /* 自定义滚动条 */
        .table-scroll-container::-webkit-scrollbar {
            width: 8px;
        }
        .table-scroll-container::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }
        .table-scroll-container::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 4px;
        }
        .table-scroll-container::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8;
        }
        
        /* 固定表头 */
        .table-scroll-container .ant-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }
        .table-scroll-container .ant-table thead {
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .table-scroll-container .ant-table thead th {
            background: #fafafa;
            border-bottom: 2px solid #f0f0f0;
        }
        
        /* 分页包装器 */
        .pagination-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            border-top: 1px solid #f0f0f0;
            background: #fafafa;
        }
        .pagination-info {
            font-size: 14px;
            color: #595959;
        }
        .pagination-info strong {
            color: #262626;
            font-weight: 600;
        }
        
        /* 可排序表头 */
        .sortable-header {
            position: relative;
            cursor: pointer;
            user-select: none;
        }
        .sortable-header:hover {
            background: #e6f7ff !important;
        }
        .sort-link {
            color: #262626;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 4px;
        }
        .sort-link:hover {
            color: #1890ff;
            text-decoration: none;
        }
        .sort-link .bi {
            font-size: 12px;
            color: #bfbfbf;
        }
        .sort-link .bi-sort-up,
        .sort-link .bi-sort-down {
            color: #1890ff;
        }
    </style>

    <script th:fragment="scripts">
        function showDetail(petId) {
            fetch('/admin/api/pet/' + petId)
                .then(r => r.json())
                .then(data => {
                    if (data.success) {
                        const pet = data.data;
                        let html = '<div class="row">';
                        html += '<div class="col-md-6"><table class="table table-sm">';
                        html += '<tr><th>编号</th><td>' + (pet.code || '-') + '</td></tr>';
                        html += '<tr><th>名称</th><td>' + (pet.name || '-') + '</td></tr>';
                        html += '<tr><th>等级</th><td>' + (pet.level || '-') + '</td></tr>';
                        html += '<tr><th>服务器</th><td>' + (pet.serverName || '-') + '</td></tr>';
                        html += '<tr><th>大区</th><td>' + (pet.area || '-') + '</td></tr>';
                        html += '<tr><th>价格</th><td>' + (pet.price || '-') + '</td></tr>';
                        html += '<tr><th>收藏数</th><td>' + (pet.collect || '-') + '</td></tr>';
                        html += '<tr><th>技能数</th><td>' + (pet.skillNum || 0) + '</td></tr>';
                        html += '<tr><th>技能列表</th><td>' + (pet.skillList || '-') + '</td></tr>';
                        html += '</table></div>';
                        
                        html += '<div class="col-md-6"><table class="table table-sm">';
                        html += '<tr><th>气血</th><td>' + (pet.blood || '-') + '</td></tr>';
                        html += '<tr><th>魔法</th><td>' + (pet.magic || '-') + '</td></tr>';
                        html += '<tr><th>攻击</th><td>' + (pet.attack || '-') + '</td></tr>';
                        html += '<tr><th>防御</th><td>' + (pet.defense || '-') + '</td></tr>';
                        html += '<tr><th>速度</th><td>' + (pet.speed || '-') + '</td></tr>';
                        html += '<tr><th>成长</th><td>' + (pet.growUp || '-') + '</td></tr>';
                        html += '<tr><th>寿命</th><td>' + (pet.lifetime || '-') + '</td></tr>';
                        html += '<tr><th>亮点1</th><td>' + (pet.lightSpot1 || '-') + '</td></tr>';
                        html += '<tr><th>亮点2</th><td>' + (pet.lightSpot2 || '-') + '</td></tr>';
                        html += '</table></div>';
                        html += '</div>';
                        
                        document.getElementById('detailContent').innerHTML = html;
                        new bootstrap.Modal(document.getElementById('detailModal')).show();
                    } else {
                        alert(data.message);
                    }
                })
                .catch(e => alert('获取详情失败: ' + e.message));
        }

        function createReplayTask(itemCode) {
            if (!confirm('确定要重新爬取该物品吗？')) return;
            fetch('/admin/api/task/replay?itemCode=' + itemCode, { method: 'POST' })
                .then(r => r.json())
                .then(data => {
                    alert(data.message);
                })
                .catch(e => alert('操作失败: ' + e.message));
        }
    </script>
</body>
</html>
